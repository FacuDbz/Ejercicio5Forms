<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speaker Submission</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="page">

        <section class="intro">
            <h1>Speaker Submission</h1>

            <p>
                Want to speak at our fake conference?<br>
                Fill out this form.
            </p>
        </section>


        <form
            class="submission-form"
            name="speaker-submission"
            method="POST"
            data-netlify="true"
            netlify-honeypot="bot-field"
        >

            <!-- Netlify necesita este input oculto para poder parsear el form en el build -->
            <input type="hidden" name="form-name" value="speaker-submission">

            <!-- Honeypot anti-spam -->
            <p style="display:none;">
                <label>No llenar esto: <input name="bot-field"></label>
            </p>

            <!-- NAME -->
            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

            </div>


            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <!-- TYPE OF TALK -->
            <fieldset class="form-group radio-group-row">

                <legend>
                    Type of Talk
                </legend>

                <div class="radio-group">

                    <input
                        type="radio"
                        id="talk-main-stage"
                        name="talk"
                        value="main-stage"
                    >
                    <label for="talk-main-stage" class="radio-label">Main Stage</label>

                    <input
                        type="radio"
                        id="talk-workshop"
                        name="talk"
                        value="workshop"
                    >
                    <label for="talk-workshop" class="radio-label">Workshop</label>

                </div>

            </fieldset>


            <!-- T-SHIRT -->
            <div class="form-group">

                <label for="shirt">
                    T-Shirt Size
                </label>

                <select id="shirt" name="shirt">

                    <option value="xs">Extra Small</option>
                    <option value="s">Small</option>
                    <option value="m">Medium</option>
                    <option value="l">Large</option>
                    <option value="xl">Extra Large</option>

                </select>

            </div>


            <!-- ABSTRACT -->
            <div class="form-group abstract-group">

                <label for="abstract">
                    Abstract
                </label>

                <div class="abstract-field">

                    <textarea
                        id="abstract"
                        name="abstract"
                        maxlength="500"
                    ></textarea>

                    <span class="help-text">
                        Describe your talk in 500 words or less
                    </span>

                </div>

            </div>


            <!-- CHECKBOX -->
            <div class="availability">

                <label for="available" class="checkbox-label">
                    <input
                        type="checkbox"
                        id="available"
                        name="available"
                        value="is-available"
                    >
                    <span>I'm actually available the date of the talk</span>
                </label>

            </div>


            <!-- BUTTON -->
            <button type="submit">
                Submit
            </button>

        </form>

    </main>

</body>
</html>
